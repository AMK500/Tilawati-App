name: بناء تطبيق تلاوتي للأندرويد (Build Android APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: بناء وتصدير ملف APK
    runs-on: ubuntu-latest

    steps:
      - name: استدعاء الكود (Checkout Code)
        uses: actions/checkout@v4

      - name: تثبيت جافا 17 (Set up JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: إعداد Gradle وتصريح التشغيل
        run: |
          cd android
          chmod +x gradlew || true

      - name: بناء ملف APK للأندرويد (Assemble Debug APK)
        run: |
          cd android
          # استخدام gradle لبناء التطبيق
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: رفع ملف الـ APK كملف جاهز للتحميل (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Tilawati-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: إنشاء إصدار تلقائي على GitHub (Create Release)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-release
          name: الإصدار الأحدث من تطبيق تلاوتي للأندرويد
          body: |
            تحديث جديد لتطبيق تلاوتي للقرآن الكريم.
            يمكنك تحميل ملف الـ APK وتثبيته مباشرة على هاتفك الأندرويد.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
